name: Discover lead sources

# No secrets are used or needed: search is DuckDuckGo via ddgs, which takes
# no API key. This used to require FIRECRAWL_API_KEY, which in a public repo
# meant being careful that no fork-PR trigger could ever expose it. That
# whole class of problem went away with the paid API.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily, off the top of the hour
  workflow_dispatch:
    inputs:
      regions:
        description: "Comma-separated regions (blank = the built-in sweep)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: discover-sources
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install search dependency
        run: pip install --quiet ddgs==9.16.0

      - name: Discover sources
        run: |
          python3 backend/scripts/discover_sources.py ${{ inputs.regions && format('--regions "{0}"', inputs.regions) || '' }}

      - name: Commit any new sources
        run: |
          if git diff --quiet -- sources/discovered_sites.json; then
            echo "No new sources today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/discovered_sites.json
          git commit -m "Discovered lead sources: $(date -u +%Y-%m-%d)"
          git push

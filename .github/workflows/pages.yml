name: Publish site

# Why this exists: Bureau runs on a personal Mac, so it's unreachable
# whenever that Mac sleeps — and a laptop sleeps. GitHub Pages is free,
# always on, needs no card and never sleeps; it just cannot run Python,
# SQLite or a local model. So this rebuilds a static site carrying the lead
# data and publishes that.
#
# No secrets are used. The three job-board APIs this refetches are keyless,
# and the scraping sources that do need a local model aren't run here — their
# leads come from the committed snapshot instead (see export_leads.py).
on:
  schedule:
    - cron: "40 4 * * *" # 04:40 UTC daily, after the source-discovery job
  workflow_dispatch:
  push:
    branches: [main]
    # Deliberately not path-filtered: the build is quick, the site should
    # track main, and a narrow filter would mean an ordinary commit couldn't
    # trigger a republish.

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; let the running one land.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        # Only what the three keyless sources actually import. Notably NOT
        # playwright/trafilatura/ddgs or Ollama: those belong to the
        # scraping sources, which can't run here anyway.
        run: pip install --quiet httpx sqlalchemy python-dotenv

      - name: Build the static site
        run: python3 backend/scripts/build_site.py --out site

      - name: Show what was built
        run: |
          ls -la site site/data
          du -sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
